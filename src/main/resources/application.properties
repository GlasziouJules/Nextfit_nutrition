# =============================================
# NextFit Nutrition — Configuration Spring Boot
# =============================================

spring.application.name=nextfit-nutrition

# --- Base de données H2 (développement) ---
spring.datasource.url=jdbc:h2:mem:nextfit_nutrition;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Console H2 (accès via http://localhost:8080/h2-console) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Serveur ---
server.port=8080

# --- Logs ---
logging.level.com.nextfit=INFO
logging.level.org.springframework.web=WARN
